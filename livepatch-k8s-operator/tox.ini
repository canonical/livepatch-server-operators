[tox]
skipsdist = True
skip_missing_interpreters = True
envlist = fmt, lint, unit, static, flaplint, coverage-report
max-line-length = 120

[isort]
profile = black

[vars]
src_path = {toxinidir}/src/
tst_path = {toxinidir}/tests/
all_path = {[vars]src_path} {[vars]tst_path}

[testenv]
basepython = python3
setenv =
  PYTHONPATH = {toxinidir}:{toxinidir}/lib:{[vars]src_path}
  PYTHONBREAKPOINT=ipdb.set_trace
  PY_COLORS=1
passenv =
  PYTHONPATH
  CHARM_BUILD_DIR
  MODEL_SETTINGS

[testenv:fmt]
skip_install=True
description = run formatters
deps =
    black==23.9.1
    isort==5.12.0
commands =
    black {[vars]all_path}
    isort --profile black {[vars]all_path}

[testenv:lint]
description = Lint the code
deps =
    black==24.4.2
    codespell==2.2.1
    flake8-builtins==2.5.0
    flake8-copyright==0.2.4
    flake8-docstrings-complete>=1.3.0
    flake8-docstrings==1.7.0
    flake8-test-docs>=1.0
    flake8==7.0.0
    isort==5.10.1
    mypy
    pep8-naming==0.13.2
    pydocstyle
    pylint
    pyproject-flake8==7.0.0
commands =
    black --check {[vars]all_path}
    isort --profile black --check-only {[vars]all_path}
    pydocstyle {[vars]src_path}
    codespell {toxinidir} --skip {toxinidir}/.git --skip {toxinidir}/.tox \
      --skip {toxinidir}/build --skip {toxinidir}/lib --skip {toxinidir}/venv \
      --skip {toxinidir}/.mypy_cache --skip {toxinidir}/icon.svg
    pflake8 --config {toxinidir}/pyproject.toml {[vars]all_path}
    mypy {[vars]all_path} --ignore-missing-imports --follow-imports=skip --install-types --non-interactive --exclude {toxinidir}/lib/*
    pylint {[vars]all_path} --disable=E0401,W1203,W0613,W0718,R0903,W1514,C0103,R0913,C0301,W0212,R0902,C0104,E1121,R0801,E1120,W0511,C0415,C0114

[testenv:coverage-report]
description = Create test coverage report
deps =
    pytest
    coverage[toml]
    -r{toxinidir}/requirements.txt
commands =
    coverage report

[testenv:static]
description = Run static analysis tests
deps =
    bandit[toml]
    -r{toxinidir}/requirements.txt
commands =
    bandit -c {toxinidir}/pyproject.toml -r {[vars]src_path} {[vars]tst_path}


[testenv:flaplint]
description = Check for nondeterministic charm writes
deps =
    flaplint @ git+https://github.com/michaeldmitry/flaplint@v1.1.2
commands =
    flaplint {[vars]src_path} --no-deps --own-only --min-confidence high


[testenv:unit]
description = Run unit tests
deps =
    pytest
    coverage[toml]
    jinja2
    juju~=2.9
    pytest
    pytest_asyncio
    ops[testing]
    -r{toxinidir}/requirements.txt
commands =
    coverage run --source={[vars]src_path} \
        -m pytest --ignore={[vars]tst_path}integration -v {posargs}
    coverage report


[testenv:integration]
description = Run integration tests
deps =
    pytest
    jubilant>=1.8,<2
    pytest-jubilant>=2,<3
    requests
    pyyaml
    -r{toxinidir}/requirements.txt
passenv =
    {[testenv]passenv}
    CHARM_PATH
    LIVEPATCH_APP_IMAGE
    LIVEPATCH_APP_IMAGE_AUTH
    JUJU_K8S_CLOUD
    JUJU_LXD_CLOUD
    JUJU_K8S_WORKLOAD_STORAGE
    JUJU_CROSS_MODEL_CONTROLLER
    JUJU_K8S_SECONDARY_CLOUD
# `opcli pytest run` appends the selected test module to posargs, so the
# default target is only used when no module/path is given.
commands =
    pytest -v -x --tb native --log-cli-level=INFO -s {posargs:{[vars]tst_path}integration}
