[tox]
skipsdist = True
envlist = shared, lint-shared

[testenv:shared]
description = Test the shared/livepatch_common modules
deps =
    pytest
    requests
    pyyaml
setenv =
    PYTHONPATH = {toxinidir}/shared
commands =
    pytest shared/tests -v

[testenv:lint-shared]
description = Lint the shared/livepatch_common modules and shared/tests
deps =
    black==24.4.2
    codespell==2.2.1
    flake8-builtins==2.5.0
    flake8-copyright==0.2.4
    flake8-docstrings-complete>=1.3.0
    flake8-docstrings==1.7.0
    flake8-test-docs>=1.0
    flake8==7.0.0
    isort==5.10.1
    mypy
    pep8-naming==0.13.2
    pydocstyle
    pylint
    pyproject-flake8==7.0.0
setenv =
    PYTHONPATH = {toxinidir}/shared
commands =
    black --check --line-length 120 {toxinidir}/shared/
    isort --profile black --line-length 120 --check-only {toxinidir}/shared/
    pydocstyle {toxinidir}/shared/livepatch_common/
    codespell {toxinidir}/shared/
    pflake8 --config {toxinidir}/livepatch-k8s-operator/pyproject.toml {toxinidir}/shared/
    mypy {toxinidir}/shared/ --ignore-missing-imports --follow-imports=skip --install-types --non-interactive
    pylint {toxinidir}/shared/livepatch_common/ --disable=E0401,W1203,W0613,W0718,R0903,W1514,C0103,R0913,C0301,W0212,R0902,C0104,E1121,R0801,E1120,W0511,C0415,C0114,W0603
    pylint {toxinidir}/shared/tests/ --disable=E0401,W1203,W0613,W0718,R0903,W1514,C0103,R0913,C0301,W0212,R0902,C0104,E1121,R0801,E1120,W0511,C0415,C0114,C0116,C1803,W0404,W0621
