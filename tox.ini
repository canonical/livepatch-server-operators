[tox]
skipsdist = True
envlist = config-parity, shared

[testenv:config-parity]
description = Assert machine and k8s charms expose identical config options
deps =
    pytest
    pyyaml
commands =
    pytest tests/test_config_parity.py -v

[testenv:shared]
description = Test the shared/livepatch_common modules
deps =
    pytest
    requests
    pyyaml
setenv =
    PYTHONPATH = {toxinidir}/shared
commands =
    pytest shared/tests -v
