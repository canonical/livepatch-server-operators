juju:
  channel: 3.6/stable
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "true"
  extra-bootstrap-args: --config agent-stream=proposed

providers:
  lxd:
    enable: true
    bootstrap: true
  microk8s:
    enable: true
    # Not bootstrapped: the single controller is on LXD (so the `localhost`
    # credential is native), and MicroK8s is added to it as a secondary cloud by
    # the test fixtures. Enabling the provider still installs MicroK8s, enables
    # the addons, and writes a kubeconfig (whose API server is the routable node
    # IP) that `juju add-k8s` consumes.
    bootstrap: false
    addons:
      - hostpath-storage
      - dns
      - rbac
      - ingress
      - metallb

host:
  snaps:
    charmcraft:
