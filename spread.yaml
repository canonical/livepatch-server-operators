project: livepatch-server-operators
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    # The `-large` systems carry the disk-hungry tests (postgresql-k8s blocks on
    # "<10% free space on pgdata volume" on the default GitHub-hosted runner)
    # and run on the team's self-hosted xlarge flavour so MicroK8s, the gateway
    # charms and the LXD machine needed by the airgapped test have CPU and
    # memory headroom.
    - ubuntu-24.04-large:
        runner: self-hosted-linux-amd64-noble-xlarge
    - ubuntu-26.04-large:
        runner: self-hosted-linux-amd64-noble-xlarge
  integration-test-machine:
    type: integration-test
    systems:
    # The runner label is looked up by system name across all backends, so this
    # must not reuse the k8s backend's `ubuntu-24.04-large` name: that would make
    # the machine suites inherit the k8s runner.
    - ubuntu-24.04-machine:
        runner: self-hosted-linux-amd64-noble-medium
    environment:
      CONCIERGE: concierge-machine-juju3.yaml
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge-juju3.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
  # Credentials for the private `app-image` OCI image. Empty outside CI, in
  # which case the image is pulled anonymously.
  REGISTRY_USERNAME: '$(HOST: echo "${GITHUB_ACTOR:-}")'
  REGISTRY_PASSWORD: '$(HOST: echo "${GITHUB_TOKEN:-}")'
exclude:
- .git
- .tox
- .venv
- .*_cache

x-machine-suite: &machine-suite
  # Suite keys below (e.g. `.../ubuntu-20.04/`) are labels only; test discovery
  # uses this shared path, so every per-base suite intentionally runs the full
  # integration set with a different CHARM_BASE build.
  discover-path: livepatch-machine-operator/tests/integration/
  working-dir: livepatch-machine-operator/
  summary: livepatch-machine-operator integration tests
  systems: [ubuntu-24.04-machine]
  backends:
  - integration-test-machine
  auto-discover: true
  pytest-arguments-template: '-x --log-format="%(asctime)s %(levelname)s %(message)s" --juju-dump-logs'
  pytest-environment-template: |
    {% for charm in artifacts.charms if charm.name == "canonical-livepatch-server" %}{% for build in charm.builds if build.arch == arch and build.base == env.get("CHARM_BASE", "") %}
    CHARM_PATH={{ build.path }}
    {% endfor %}{% endfor %}
    CHARM_BASE={{ env.get("CHARM_BASE", "") }}

integration-suites:
  # Every test deploys postgresql-k8s, which blocks on "<10% free space on
  # pgdata volume" on GitHub-hosted runners, so all run on the `-large` systems.
  livepatch-k8s-operator/tests/integration/:
    summary: livepatch-k8s-operator integration tests
    systems: [ubuntu-24.04-large, ubuntu-26.04-large]
    auto-discover: true
    working-dir: livepatch-k8s-operator/
    backends:
    - integration-test
    # `app-image` is a private GHCR image, so write a credentials file that the
    # tests hand to Juju, which turns it into a Kubernetes image pull secret.
    # Keeping the password in a file keeps it off the pytest command line.
    prepare: |
      if [ -n "${REGISTRY_PASSWORD}" ]; then
        touch /home/ubuntu/.app-image-auth.yaml
        chmod 0600 /home/ubuntu/.app-image-auth.yaml
        chown ubuntu:ubuntu /home/ubuntu/.app-image-auth.yaml
        cat > /home/ubuntu/.app-image-auth.yaml <<EOF
      username: ${REGISTRY_USERNAME}
      password: ${REGISTRY_PASSWORD}
      EOF
      fi
    restore: |
      rm -f /home/ubuntu/.app-image-auth.yaml
    # pytest-jubilant tears the per-module models down by default; pass
    # `--no-juju-teardown`/`--juju-model` locally to keep them. The single
    # controller is bootstrapped on LXD and the fixtures pick the cloud per
    # model, so no `--juju-controller` is set.
    pytest-arguments-template: '-x --log-format="%(asctime)s %(levelname)s %(message)s" --juju-dump-logs'
    # SPREAD_SYSTEM (e.g. ubuntu-26.04-large) is only visible here, not to
    # pytest, so the build matching the system's base is picked in this template.
    pytest-environment-template: |
      {% set system_base = env.get("SPREAD_SYSTEM", "").replace("-large", "") %}
      {% for build in artifacts.charms[0].builds if build.arch == arch and (build.base or "").replace("@", "-") == system_base %}
      CHARM_PATH={{ build.path }}
      {% endfor %}
      LIVEPATCH_APP_IMAGE_AUTH=/home/ubuntu/.app-image-auth.yaml
  # The machine charm is built once per base and each build is deployed on a
  # unit of that base. All of them run on the same 24.04 host (the host OS is
  # irrelevant to the unit base), so there is one suite per base; CHARM_BASE
  # selects the matching build in the template below.
  livepatch-machine-operator/tests/integration/ubuntu-20.04/:
    <<: *machine-suite
    environment:
      CHARM_BASE: ubuntu@20.04
  livepatch-machine-operator/tests/integration/ubuntu-22.04/:
    <<: *machine-suite
    environment:
      CHARM_BASE: ubuntu@22.04
  livepatch-machine-operator/tests/integration/ubuntu-24.04/:
    <<: *machine-suite
    environment:
      CHARM_BASE: ubuntu@24.04
  livepatch-machine-operator/tests/integration/ubuntu-26.04/:
    <<: *machine-suite
    environment:
      CHARM_BASE: ubuntu@26.04
