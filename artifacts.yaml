version: 1
charms:
- name: canonical-livepatch-server-k8s
  charmcraft-yaml: livepatch-k8s-operator/charmcraft.yaml
  platforms:
  - arch: amd64
  # No rock: opcli publishes the image from the resource's upstream-source.
  resources:
    app-image:
      type: oci-image
- name: canonical-livepatch-server
  charmcraft-yaml: livepatch-machine-operator/charmcraft.yaml
  platforms:
  # Packing every base in one job needs more disk than a GitHub-hosted runner has.
  - arch: amd64
    runner: [self-hosted-linux-amd64-noble-medium]
