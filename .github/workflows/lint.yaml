name: Lint

on:
  pull_request:

jobs:
  lint:
    name: Lint (${{ matrix.charm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - charm: livepatch-machine-operator
          - charm: livepatch-k8s-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Sync shared sources
        run: make sync

      - name: Run linter
        working-directory: ${{ matrix.charm }}
        run: tox -e lint

  shared-lint:
    name: Lint (shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run shared linter
        run: tox -e lint-shared
