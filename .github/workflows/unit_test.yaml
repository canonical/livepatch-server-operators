name: Unit tests

on:
  pull_request:

jobs:
  unit-test:
    name: Unit tests (${{ matrix.charm }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - charm: livepatch-machine-operator
            continue-on-error: false
          - charm: livepatch-k8s-operator
            continue-on-error: true # remove once k8s unit tests are updated
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run unit tests
        working-directory: ${{ matrix.charm }}
        run: tox -e unit
