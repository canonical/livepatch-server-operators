name: Unit tests

on:
  pull_request:

jobs:
  unit-test:
    name: Unit tests (${{ matrix.charm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - charm: livepatch-machine-operator
          - charm: livepatch-k8s-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Sync shared sources
        run: make sync

      - name: Run unit tests
        working-directory: ${{ matrix.charm }}
        run: tox -e unit

  shared-unit-test:
    name: Unit tests (shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run shared unit tests
        run: make unit-test-shared
