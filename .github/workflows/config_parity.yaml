name: Config parity

on:
  pull_request:

jobs:
  config-parity:
    name: Config parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run config parity tests
        run: tox -e config-parity
