# Temporary hotfix replacement for publish.yaml: builds the k8s charm with
# opcli and uploads it directly, instead of fetching artifacts from an
# integration-test run. Do not merge to main.

name: Publish k8s charm

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track"
        type: choice
        options:
          - legacy
          - latest
        default: latest

run-name: Release k8s charm by @${{ github.actor }}

env:
  # charm-ci v1.0.1; keep in sync with integration_test.yaml
  OPCLI_GIT_REF: 58ae6614a3b143d4e57eff0fd1770e97d8c30fab

jobs:
  upload-livepatch-server-k8s:
    name: Build and upload k8s charm
    runs-on: self-hosted-linux-amd64-noble-medium
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install opcli
        run: |
          uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci.git@${OPCLI_GIT_REF}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install LXD
        run: |
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -aG lxd $USER
          sudo chmod 0666 /var/snap/lxd/common/lxd/unix.socket
          if sudo iptables -nL DOCKER-USER 2>/dev/null; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
          if sudo ip6tables -nL DOCKER-USER 2>/dev/null; then
            sudo ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Sync shared sources
        run: make sync

      - name: Build k8s charm
        env:
          # ubuntu@26.04 is still experimental for the `charm` craft-parts plugin
          CHARMCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "true"
        run: opcli artifacts build --charm canonical-livepatch-server-k8s

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload charm to charmhub
        uses: canonical/charming-actions/upload-charm@main
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          channel: "${{ inputs.track }}/edge"
          charm-path: livepatch-k8s-operator
          built-charm-path: "canonical-livepatch-server-k8s_ubuntu@24.04-amd64.charm,canonical-livepatch-server-k8s_ubuntu@26.04-amd64.charm"
