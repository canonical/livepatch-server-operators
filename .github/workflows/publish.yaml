# Hand-rolled copy of canonical/charm-ci's publish-artifacts.yml (v1.0.1) with
# a GHCR login added before publishing: the reusable workflow has no way to
# authenticate to a private registry, which `opcli artifacts publish` needs
# when pulling a private `upstream-source` OCI resource.
# Publishes the charms built and tested by integration_test.yaml for the
# current commit's tree. Switch back to the reusable workflow once charm-ci
# supports a registry login.

name: Publish charms

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Charmhub channel to publish to"
        type: string
        default: latest/edge
      dry-run:
        description: "Validate the publish without uploading to Charmhub"
        type: boolean
        default: true

env:
  # charm-ci v1.0.1; keep in sync with integration_test.yaml
  OPCLI_GIT_REF: 58ae6614a3b143d4e57eff0fd1770e97d8c30fab

jobs:
  resolve-run:
    name: Resolve run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.resolve.outputs.run-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout charm-ci scripts
        uses: actions/checkout@v4
        with:
          repository: canonical/charm-ci
          ref: ${{ env.OPCLI_GIT_REF }}
          path: .charm-ci

      - name: Resolve integration-test run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_WORKFLOW_FILE: integration_test.yaml
        run: .charm-ci/.github/scripts/resolve-run.sh

  publish:
    name: Publish
    needs: resolve-run
    runs-on: ubuntu-latest
    environment: charmhub-publish
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout charm-ci scripts
        uses: actions/checkout@v4
        with:
          repository: canonical/charm-ci
          ref: ${{ env.OPCLI_GIT_REF }}
          path: .charm-ci

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install opcli
        run: uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci.git@${OPCLI_GIT_REF}"

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Fetch build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opcli artifacts fetch \
            --run-id "${{ needs.resolve-run.outputs.run-id }}" \
            --arch all \
            --wait

      - name: Add version file to charms
        run: |
          set -euo pipefail
          CHARM_FILES=()
          while IFS= read -r -d '' charm_file; do
            CHARM_FILES+=("${charm_file}")
          done < <(find . -type f -name '*.charm' -not -path './.charm-ci/*' -print0)
          if [ "${#CHARM_FILES[@]}" -eq 0 ]; then
            echo "::error::No .charm files found after fetching build artifacts."
            exit 1
          fi
          "${GITHUB_WORKSPACE}/.charm-ci/.github/scripts/inject-charm-version.sh" \
            "${GITHUB_SHA}" \
            "${CHARM_FILES[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Charmhub
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ -z "${CHARMCRAFT_AUTH}" ]; then
            echo "::error::CHARMHUB_TOKEN secret is not set."
            exit 1
          fi
          DRY_RUN_ARGS=()
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            DRY_RUN_ARGS=(--dry-run)
          fi
          opcli artifacts publish \
            --channel "${INPUT_CHANNEL}" \
            --json \
            "${DRY_RUN_ARGS[@]}" > publish-results.json

      - name: Tag and release publish
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_TAGS: "true"
          CREATE_RELEASE: "true"
        run: .charm-ci/.github/scripts/create-publish-release.sh
