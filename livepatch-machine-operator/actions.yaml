enable:
  description: |
    Enables livepatch on-prem.
  params:
    token:
      type: string
      description: |
        A Ubuntu Pro token.
  required: [token]

schema-upgrade:
  description: Upgrade the application database schema.

set-basic-users:
  description: |
    Hashes the plaintext passwords for the given users, ready to be applied
    with `juju config`.

    This action does not change the server's configuration itself; it returns
    a `auth.basic.users` value (and the `juju config` command to set it) that
    you apply yourself. Use the `append` param to combine the new users with
    the ones already set in `auth.basic.users`, instead of replacing them.

    Provide exactly one of `users` or `users-secret`. `users` is simpler, but
    its plaintext passwords are stored in Juju's action history
    (`juju show-task`/`juju show-operation`) indefinitely; prefer
    `users-secret` outside of local testing:

      juju add-secret my-users users="user1:pass1,user2:pass2"
      juju grant-secret my-users <app-name>
      juju run <app-name>/leader set-basic-users users-secret=<secret-uri>
  params:
    users:
      type: string
      description: |
        A comma delimited list of users and password in the form of 
        <username1:password1>,<username2:password2>,<username3:password3>

        Stored in plaintext in Juju's action history. Prefer `users-secret`
        outside of local testing.
    users-secret:
      type: string
      description: |
        The URI of a Juju secret granted to this application, whose content
        has a `users` key in the same format as the `users` param.
    append:
      type: boolean
      description: |
        By using append, the hashed users are combined with the users already
        set in the `auth.basic.users` config option, instead of replacing them.

restart:
  description: Restart livepatch service daemon.

emit-updated-config:
  description: |
    Generate new yaml config based on old reactive charm config.

    Pass the contents of the old reactive charm's exported config via the
    `config-file` param. This action does not change the running configuration;
    it returns the converted options (ready to apply with `juju config`) along
    with the keys that were removed or not recognised.
  params:
    config-file:
      type: string
      description: The contents of the old reactive charm's exported config file.
  required: [config-file]
