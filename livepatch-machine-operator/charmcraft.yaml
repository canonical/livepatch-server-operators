type: "charm"
name: canonical-livepatch-server
title: Canonical Livepatch Server
summary: Canonical Livepatch Server
description: |
  The purpose of the Livepatch Server is to pull in patch updates from
  Canonical and allow more fine-grained control of patch rollout to the
  machines running on your infrastructure.

links:
  contact: Canonical Commercial Systems Team <jaas-crew@lists.canonical.com>
  documentation: https://discourse.charmhub.io/t/14446
  issues:
    - https://bugs.launchpad.net/livepatch-onprem
  source:
    - https://github.com/canonical/livepatch-machine-charm
  website:
    - https://ubuntu.com/security/livepatch
    - https://discourse.ubuntu.com/t/ubuntu-livepatch-service/22723

platforms:
  ubuntu@16.04:amd64:
  ubuntu@18.04:amd64:
  ubuntu@20.04:amd64:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

requires:
  # Note: The same relation to postgres is used for both
  # patch storage and the server
  database-legacy:
    # This relation is DEPRECATED and is only kept for backward compatibility
    # purposes.
    #
    # New deployments should use the `database` relation. Integration with both
    # of these relations at the same time will result in an error.
    interface: pgsql
    limit: 1
  database:
    interface: postgresql_client
    limit: 1 # Most charms only handle a single PostgreSQL Application.
  metrics-db:
    interface: postgresql_client
    limit: 1
    optional: true
  pro-airgapped-server:
    interface: livepatch-pro-airgapped-server
    limit: 1
    optional: true
  cve-catalog:
    interface: cve-catalog
    limit: 1
    optional: true
  send-otlp:
    interface: otlp
    limit: 1
    optional: true

provides:
  website:
    interface: http
  cos-agent:
    interface: cos_agent
    limit: 1

peers:
  livepatch:
    interface: livepatch

parts:
  charm:
    build-packages:
      - rustc
      - cargo
    charm-binary-python-packages:
      - anyio
      - bcrypt
      - certifi
      - cffi
      - charset-normalizer
      - cosl
      - exceptiongroup
      - h11
      - httpcore
      - httpx
      - idna
      - lightkube
      - lightkube-models
      - macaroonbakery
      - ops
      - ops-lib-pgsql
      - pgconnstr
      - protobuf
      - pycparser
      - pydantic
      - pymacaroons
      - PyNaCl
      - pyRFC3339
      - pytz
      - PyYAML
      - requests
      - six
      - sniffio
      - tenacity
      - typing_extensions
      - urllib3
      - websocket-client
