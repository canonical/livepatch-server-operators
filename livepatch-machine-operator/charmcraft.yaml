# https://juju.is/docs/sdk/charmcraft-config
type: "charm"
name: canonical-livepatch-server
summary: Canonical Livepatch Server
description: |
  The purpose of the Livepatch Server is to pull in patch updates from
  Canonical and allow more fine-grained control of patch rollout to the
  machines running on your infrastructure.

bases:
  - build-on:
      - name: "ubuntu"
        channel: "22.04"
        architectures:
          - amd64
    run-on:
      - name: "ubuntu"
        channel: "22.04"
        architectures:
          - amd64
parts:
  charm:
    charm-strict-dependencies: true
    requirements:
      - requirements.txt
    charm-binary-python-packages:
      - anyio
      - bcrypt
      - certifi
      - cffi
      - charset-normalizer
      - cosl
      - exceptiongroup
      - h11
      - httpcore
      - httpx
      - idna
      - lightkube
      - lightkube-models
      - macaroonbakery
      - ops
      - ops-lib-pgsql
      - pgconnstr
      - protobuf
      - pycparser
      - pydantic
      - pymacaroons
      - PyNaCl
      - pyRFC3339
      - pytz
      - PyYAML
      - requests
      - six
      - sniffio
      - tenacity
      - typing_extensions
      - urllib3
      - websocket-client
