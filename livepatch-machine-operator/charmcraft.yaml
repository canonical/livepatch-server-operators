type: "charm"
name: canonical-livepatch-server
title: Canonical Livepatch Server
summary: Canonical Livepatch Server
description: |
  The purpose of the Livepatch Server is to pull in patch updates from
  Canonical and allow more fine-grained control of patch rollout to the
  machines running on your infrastructure.

links:
  contact: Canonical Commercial Systems Team <jaas-crew@lists.canonical.com>
  documentation: https://discourse.charmhub.io/t/14446
  issues:
    - https://bugs.launchpad.net/livepatch-onprem
  source:
    - https://github.com/canonical/livepatch-machine-charm
  website:
    - https://ubuntu.com/security/livepatch
    - https://discourse.ubuntu.com/t/ubuntu-livepatch-service/22723

platforms:
  ubuntu@20.04:amd64:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

requires:
  # Note: The same relation to postgres is used for both
  # patch storage and the server
  database-legacy:
    # This relation is DEPRECATED and is only kept for backward compatibility
    # purposes.
    #
    # New deployments should use the `database` relation. Integration with both
    # of these relations at the same time will result in an error.
    interface: pgsql
    limit: 1
  database:
    interface: postgresql_client
    limit: 1 # Most charms only handle a single PostgreSQL Application.
  metrics-db:
    interface: postgresql_client
    limit: 1
    optional: true
  pro-airgapped-server:
    interface: livepatch-pro-airgapped-server
    limit: 1
    optional: true
  cve-catalog:
    interface: cve-catalog
    limit: 1
    optional: true
  send-otlp:
    interface: otlp
    limit: 1
    optional: true

provides:
  website:
    interface: http
  cos-agent:
    interface: cos_agent
    limit: 1

peers:
  livepatch:
    interface: livepatch

parts:
  charm:
    build-packages:
      - rustc
      - cargo
    charm-binary-python-packages:
      - 'anyio==4.6.2; python_version >= "3.9"'
      - 'anyio==3.7.1; python_version < "3.9"'
      - bcrypt==4.2.0
      - certifi==2024.8.30
      - cffi==1.17.1
      - charset-normalizer==3.4.0
      - cosl==0.0.41
      - exceptiongroup==1.2.2
      - h11==0.14.0
      - httpcore==1.0.6
      - httpx==0.27.2
      - idna==3.10
      - lightkube==0.15.4
      - 'lightkube-models==1.36.3.8; python_version >= "3.9"'
      - 'lightkube-models==1.34.0.8; python_version < "3.9"'
      - macaroonbakery==1.3.2
      - 'ops==3.8.2; python_version >= "3.10"'
      - 'ops==2.23.6; python_version < "3.10"'
      - ops-lib-pgsql==1.4
      - pgconnstr==1.0.1
      - protobuf==3.20.3
      - pycparser==2.22
      - pydantic==1.10.18
      - pymacaroons==0.13.0
      - PyNaCl==1.5.0
      - pyRFC3339==1.1
      - pytz==2024.2
      - PyYAML==6.0.2
      - requests==2.32.3
      - six==1.16.0
      - sniffio==1.3.1
      - tenacity==9.0.0
      - typing_extensions==4.12.2
      - urllib3==2.2.3
      - websocket-client==1.8.0
