options:
  server.log-level:
    default: info
    description: The servers log level.
    type: string
  server.url-template:
    default: ""
    description: |
      Template string to use when making URLs for giving back to the client.

      e.g. https://livepatch-hosting.com/v1/patches/{filename}

      This will need to be configured once the url or ip address of the service
      is known.
    type: string
  server.server-address:
    default: 0.0.0.0:8080
    description: The address to bind the server to.
    type: string
  server.concurrency-limit:
    default: 1000
    description: Maximum number of API requests being served concurrently.
    type: int
  server.burst-limit:
    default: 500
    description: |
      The maximum number of concurrently incoming requests.

      After this limit, requests are queued according to the following:
      concurrency-limit - burst-limit

      For defaults, this is:
      1000 - 500 = 500 (Maximum queue).

      Once the queue is reached, subsequent requests are rejected.
    type: int
  server.redirect-downloads:
    default: False
    description: |
      When true, the server will redirect downloads directed at its /v1/patches/{filename}
      endpoint to the endpoint defined in the server.url-template config option. This is
      useful if you want patch downloads to be redirected to a fileserver fronting patches.
      Note: Do not enable this option if the server.url-template is configured as the
      Livepatch-server as this will result in a redirect loop.
    type: boolean

  cloud-delay.enabled:
    default: false
    description: |
      Whether to enable the delayed roll-out of patches based on a client's cloud.
    type: boolean
  cloud-delay.default-delay-hours:
    description: "Default delay hours for clouds/regions/azs without predefined delay hours."
    type: int
    default: 0
  auth.sso.enabled:
    default: false
    description: |
      Note: Currently not available for on-prem users!

      Whether or not OIDCSSO authentication should be enabled.
    type: boolean
  auth.sso.teams:
    default: ""
    description: |
      Note: Currently not available for on-prem users!

      A list of comma separated launchpad teams that are allowed access
      when connecting to the admin tool by OIDCSSO authentication.
    type: string
  auth.sso.url:
    description: |
      URL to access for SSO auth.
    type: string
  auth.sso.public-key:
    description: Public key for the auth server
    type: string
  auth.basic.enabled:
    default: false
    description: |
      Whether basic auth should be used.
    type: boolean
  auth.basic.users:
    description: |
      A comma separated list of "user:password-hash" pairs used for authentication,
      where the password-hash is a bcrypt hash of the plaintext password. You can
      use the `set-basic-users` action to get the bcrypt hash for a plaintext
      password.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      auth.basic.users-secret to a Juju secret URI instead.
    type: string
  auth.basic.users-secret:
    description: |
      Preferred, Juju-secret-backed alternative to auth.basic.users: takes priority over
      it when both are set. Must be set to the URI of a Juju secret containing a `value`
      key with the comma separated "user:password-hash" pairs, e.g.:
        juju add-secret livepatch-basic-users value="user:hash"
        juju grant-secret livepatch-basic-users canonical-livepatch-server
        juju config canonical-livepatch-server auth.basic.users-secret=<secret-uri>
    type: secret
  contracts.enabled:
    default: false
    description: Whether use of the contracts service is enabled.
    type: boolean
  contracts.url:
    default: "https://contracts.canonical.com"
    description: URL to hit for the contracts service
    type: string
  contracts.user:
    description: |
      Username to authenticate with backend contracts service.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      the `user` key of contracts.credentials to a Juju secret instead.
    type: string
  contracts.password:
    description: |
      Password to authenticate with backend contracts service.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      the `password` key of contracts.credentials to a Juju secret instead.
    type: string
  contracts.ca:
    description: |
      A certificate of the CA that issued the certificate of the contracts service.
      Use 'include-base64://' in a bundle to include a certificate. Otherwise,
      pass a base64-encoded certificate (base64 of "-----BEGIN" to "-----END").

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      the `ca` key of contracts.credentials to a Juju secret instead.
    type: string
    default: ""
  contracts.credentials:
    description: |
      Preferred, Juju-secret-backed alternative to contracts.user/contracts.password/
      contracts.ca: any key set here takes priority over its plain-text counterpart above.

      Must be set to the URI of a Juju secret with (as applicable) `user`, `password`
      and `ca` keys, e.g.:
        juju add-secret livepatch-contracts-credentials user=<user> password=<password>
        juju grant-secret livepatch-contracts-credentials canonical-livepatch-server
        juju config canonical-livepatch-server contracts.credentials=<secret-uri>

      `ca` is a base64-encoded certificate of the CA that issued the certificate of the
      contracts service (base64 of "-----BEGIN" to "-----END").
    type: secret
  database.connection-pool-max:
    default: 10
    description: The maximum pool of connections to PostgreSQL.
    type: int
  database.connection-lifetime-max:
    default: 10m
    description: The lifespan of an idle PostgreSQL connection.
    type: string
  patch-storage.type:
    default: filesystem
    description: |
      The storage type to be used by the charm, defaults to filesystem.
      The path can be located under:
        /var/snap/canonical-livepatch-server/common/patches

      The available options are:
        - filesystem
        - swift
        - postgres
        - s3
        - gcs
        - azure
        - ibm
        - oracle

      When using postgres for storage, the charm will work automatically by means of relation.
      The default database name is under:
        livepatch

      The database name can be changed but must be created.
    type: string
  patch-storage.swift-username:
    default: ""
    description: The Swift username to login against when using API key authorisation.
    type: string
  patch-storage.swift-api-key:
    default: ""
    description: |
      An authorisation API key for swift.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      patch-storage.swift-api-key-secret to a Juju secret URI instead.
    type: string
  patch-storage.swift-api-key-secret:
    description: |
      Preferred, Juju-secret-backed alternative to patch-storage.swift-api-key: takes
      priority over it when both are set. Must be set to the URI of a Juju secret
      containing a `value` key with the API key.
    type: secret
  patch-storage.swift-auth-url:
    default: ""
    description: The authorisation URL for swift.
    type: string
  patch-storage.swift-domain:
    default: ""
    description: The domain the containers reside under in swift for storing patches.
    type: string
  patch-storage.swift-tenant:
    default: ""
    description: The tenant account name for your container and API service user to connect under.
    type: string
  patch-storage.swift-container:
    default: ""
    description: The swift blob storage location for storing patches.
    type: string
  patch-storage.swift-region:
    default: ""
    description: The region assigned to this domain and tenant.
    type: string
  patch-storage.postgres-connection-string:
    default: ""
    description: |
      A connection string URI to a PostgreSQL database for patch storage.

      When set to an empty string, it is handled by relation and uses the same 
      database cluster that livepatch server uses for state. The database name is 'livepatch'.

      If this is to be changed, it is expected that the database you wish to connect to is 
      created manually.
    type: string
  patch-storage.s3-bucket:
    default: ""
    description: The S3 bucket to store patches within.
    type: string
  patch-storage.s3-endpoint:
    default: ""
    description: The S3 API presigned endpoint.
    type: string
  patch-storage.s3-region:
    default: ""
    description: The AWS region for this S3 storage.
    type: string
  patch-storage.s3-secure:
    default: false
    description: Whether or not to perform TLS.
    type: boolean
  patch-storage.s3-access-key:
    default: ""
    description: |
      AWS programmatic API access key. Must be set together with patch-storage.s3-secret-key.
      When both are omitted, the AWS SDK's default credential chain is used instead, which
      includes credentials bound to the VM/instance the server runs on.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting the
      `access-key` key of patch-storage.s3-credentials to a Juju secret instead.
    type: string
  patch-storage.s3-secret-key:
    default: ""
    description: |
      AWS programmatic API secret key, used together with patch-storage.s3-access-key.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting the
      `secret-key` key of patch-storage.s3-credentials to a Juju secret instead.
    type: string
  patch-storage.s3-credentials:
    description: |
      Preferred, Juju-secret-backed alternative to patch-storage.s3-access-key/
      patch-storage.s3-secret-key: any key set here takes priority over its plain-text
      counterpart above. When both this and the plain-text options are omitted, the AWS
      SDK's default credential chain is used instead, which includes credentials bound to
      the VM/instance the server runs on.

      Must be set to the URI of a Juju secret with `access-key` and `secret-key` keys.
    type: secret
  patch-storage.s3-use-path-style:
    default: false
    description: |
      Whether to use path-style S3 URLs (https://s3.amazonaws.com/BUCKET/KEY) instead of
      virtual-hosted-style URLs (https://BUCKET.s3.amazonaws.com/KEY). Required for some
      S3-compatible services (e.g. MinIO), and not needed for AWS S3.
    type: boolean
  patch-storage.s3-assume-role-arn:
    default: ""
    description: |
      An optional IAM role ARN to assume via STS. When set, the resolved AWS credentials
      are used to assume this role via STS instead of being used directly.
    type: string
  patch-storage.gcs-bucket:
    default: ""
    description: The Google Cloud Storage bucket to store patches within.
    type: string
  patch-storage.gcs-credentials-file:
    default: ""
    description: |
      Path to a Google Cloud service account credentials JSON file. When omitted (along with
      patch-storage.gcs-credentials-json), Application Default Credentials are used instead,
      which includes credentials bound to the VM (GCE metadata service, workload identity, etc).
    type: string
  patch-storage.gcs-credentials-json:
    default: ""
    description: |
      Google Cloud service account credentials, as a JSON string. When omitted (along with
      patch-storage.gcs-credentials-file), Application Default Credentials are used instead.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      patch-storage.gcs-credentials-json-secret to a Juju secret URI instead.
    type: string
  patch-storage.gcs-credentials-json-secret:
    description: |
      Preferred, Juju-secret-backed alternative to patch-storage.gcs-credentials-json: takes
      priority over it when both are set. Must be set to the URI of a Juju secret containing
      a `value` key with the JSON credentials.
    type: secret
  patch-storage.gcs-impersonate-service-account:
    default: ""
    description: |
      An optional service account email to impersonate. When set, the resolved credentials
      are used to impersonate this service account instead of being used directly.
    type: string
  patch-storage.azure-container:
    default: ""
    description: The Azure Blob Storage container to store patches within.
    type: string
  patch-storage.azure-account-name:
    default: ""
    description: |
      The Azure Storage account name. Required unless the `connection-string` key of
      patch-storage.azure-credentials is set, which already carries the account name and key.
    type: string
  patch-storage.azure-account-key:
    default: ""
    description: |
      The Azure Storage account key, used together with patch-storage.azure-account-name for
      shared key authentication.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting the
      `account-key` key of patch-storage.azure-credentials to a Juju secret instead.
    type: string
  patch-storage.azure-connection-string:
    default: ""
    description: |
      An Azure Storage connection string. When set, this is used instead of
      patch-storage.azure-account-name/patch-storage.azure-account-key for authentication.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting the
      `connection-string` key of patch-storage.azure-credentials to a Juju secret instead.
    type: string
  patch-storage.azure-credentials:
    description: |
      Preferred, Juju-secret-backed alternative to patch-storage.azure-account-key/
      patch-storage.azure-connection-string/patch-storage.azure-client-secret: any key set
      here takes priority over its plain-text counterpart above.

      Must be set to the URI of a Juju secret with (as applicable) the following keys:
        - `account-key`: shared key authentication, used with patch-storage.azure-account-name.
        - `connection-string`: used instead of patch-storage.azure-account-name/`account-key`.
        - `client-secret`: the Entra ID (Azure AD) service principal's client secret.
    type: secret
  patch-storage.azure-tenant-id:
    default: ""
    description: |
      The Entra ID (Azure AD) tenant ID, used together with patch-storage.azure-client-id and
      the `client-secret` key of patch-storage.azure-credentials for service principal
      authentication.
    type: string
  patch-storage.azure-client-id:
    default: ""
    description: The Entra ID (Azure AD) service principal's client ID.
    type: string
  patch-storage.azure-client-secret:
    default: ""
    description: |
      The Entra ID (Azure AD) service principal's client secret.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting the
      `client-secret` key of patch-storage.azure-credentials to a Juju secret instead.
    type: string
  patch-storage.azure-managed-identity-client-id:
    default: ""
    description: |
      When patch-storage.azure-account-name, the `connection-string` key of
      patch-storage.azure-credentials, and the service principal fields are all omitted,
      a managed identity bound to the VM is used instead. By default this is the VM's
      system-assigned managed identity; set this to the client ID of a user-assigned
      managed identity to use that one instead.
    type: string
  patch-storage.ibm-bucket:
    default: ""
    description: The IBM Cloud Object Storage bucket to store patches within.
    type: string
  patch-storage.ibm-endpoint:
    default: ""
    description: The IBM Cloud Object Storage API endpoint.
    type: string
  patch-storage.ibm-region:
    default: ""
    description: The IBM Cloud region for this Object Storage instance.
    type: string
  patch-storage.ibm-api-key:
    default: ""
    description: |
      IAM API key. Must be set together with patch-storage.ibm-service-instance-id.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      patch-storage.ibm-api-key-secret to a Juju secret URI instead.
    type: string
  patch-storage.ibm-api-key-secret:
    description: |
      Preferred, Juju-secret-backed alternative to patch-storage.ibm-api-key: takes
      priority over it when both are set. Must be set to the URI of a Juju secret
      containing a `value` key with the API key.
    type: secret
  patch-storage.ibm-service-instance-id:
    default: ""
    description: IBM Cloud service instance ID, used together with patch-storage.ibm-api-key.
    type: string
  patch-storage.ibm-trusted-profile-id:
    default: ""
    description: |
      When an IAM API key is not configured, the ambient VPC Instance Metadata Service
      is used instead. This optionally selects which trusted profile to use; when omitted,
      the instance's default trusted profile is used.
    type: string
  patch-storage.oracle-bucket:
    default: ""
    description: The Oracle Cloud Infrastructure Object Storage bucket to store patches within.
    type: string
  patch-storage.oracle-namespace:
    default: ""
    description: The Oracle Cloud Infrastructure Object Storage namespace.
    type: string
  patch-storage.oracle-region:
    default: ""
    description: The Oracle Cloud Infrastructure region for this Object Storage instance.
    type: string
  patch-storage.oracle-config-file:
    default: ""
    description: |
      Path to an OCI config file for authentication. When omitted (along with
      patch-storage.oracle-profile), instance principal authentication is used instead,
      bound to the OCI compute instance the server runs on.
    type: string
  patch-storage.oracle-profile:
    default: ""
    description: The profile name to use from the OCI config file.
    type: string
  patch-cache.enabled:
    default: false
    description: Whether or not to cache patches.
    type: boolean
  patch-cache.cache-ttl:
    default: 10m
    description: How long to persist a patch in cache whilst it has not been actively retrieved.
    type: string
  patch-cache.cache-size:
    default: 128
    description: The size of the cache in patches.
    type: int
  patch-sync.enabled:
    default: false
    description: |
      Whether or not if this instance of Livepatch Server should sync patches from another instance.

      A sync is effectively a "shared" storage, having access to the same pool of patches as the upstream 
      services patch storage.
    type: boolean
  patch-sync.minimum-kernel-version:
    description: >-
      A minimum kernel version of format "0.0.0" denoting the lowest 
      kernel version to download patches for. When no value is present,
      all are synced. For example, "5.4.0" will sync "5.4.0" and up.
    type: string
    default: ""
  patch-sync.architectures:
    description: >-
      Comma-separated list of architectures to download patches for.
      When no value is present, all are synced.
      If this field is empty, the patch sync will gather all architectures.
    type: string
    default: ""
  patch-sync.flavors:
    default: "generic,lowlatency,aws"
    description: >
      A comma separated list of kernel flavors to download patches for.
      If this field is empty, the patch sync will gather all flavors.
    type: string
  patch-sync.interval:
    default: "1h"
    description: Period between automatic patch snapshot downloads.
    type: string
  patch-sync.machine-count-strategy:
    default: "bucket"
    description: The strategy to use when counting machines in a set.
    type: string
  patch-sync.send-machine-reports:
    default: false
    description: Enable sending reports from local machines during patch synchronisation.
    type: boolean
  patch-sync.token:
    default: ""
    description: |
      Patch snapshot synchronisation token.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      patch-sync.token-secret to a Juju secret URI instead.
    type: string
  patch-sync.token-secret:
    description: |
      Preferred, Juju-secret-backed alternative to patch-sync.token: takes priority over
      it when both are set. Must be set to the URI of a Juju secret containing a `value`
      key with the token.
    type: secret
  patch-sync.upstream-url:
    default: https://livepatch.canonical.com
    description: Livepatch server to download patch snapshots from.
    type: string
  patch-sync.sync-tiers:
    description: >-
      Mirror patch tier information from the upstream server.
      WARNING: Enabling this feature will modify existing
      tier information in order to match the upstream server's
      tier structure. Avoid this if you already have tiers setup.
    type: boolean
    default: false
  patch-sync.proxy.enabled:
    default: false
    description: Whether or not to proxy patch syncs.
    type: boolean
  patch-sync.proxy.http:
    default: ""
    description: A comma separated list HTTP proxies to query for patches.
    type: string
  patch-sync.proxy.https:
    default: ""
    description: A comma separated list HTTPS proxies to query for patches.
    type: string
  patch-sync.proxy.no-proxy:
    default: ""
    description: A comma separated list of domains, IP CIDRs and/or ports to block.
    type: string
  patch-blocklist.enabled:
    default: false
    description: Whether or not to enable patch blocklist functionality for the admin tool.
    type: boolean
  patch-blocklist.refresh-interval:
    default: 5m
    description: How often to check for new blocklist entries.
    type: string
  machine-reports.database.enabled:
    default: false
    description: Whether or not to enabled machine reports writes to PostgreSQL.
    type: boolean
  machine-reports.database.retention-days:
    default: 10
    description: A thing used by the charm.
    type: int
  machine-reports.database.cleanup-row-limit:
    default: 1000
    description: Maximum number of rows to remove with a single report cleanup row.
    type: int
  machine-reports.database.cleanup-interval:
    default: 6h
    description: Time between report cleanup runs.
    type: string
  machine-reports.event-bus.enabled:
    default: false
    description: Whether or not to enable machine reports writes to kafka.
    type: boolean
  machine-reports.event-bus.brokers:
    default: ""
    description: The list of kafka brokers, comma separated to use for pushing reports.
    type: string
  machine-reports.event-bus.client-cert:
    default: ""
    description: The X509 client certificate to use for mTLS authorisation.
    type: string
  machine-reports.event-bus.client-key:
    default: ""
    description: The X509 private key associated with the client certificate to use for mTLS authorisation.
    type: string
  machine-reports.event-bus.ca-cert:
    default: ""
    description: The X509 intermediate or root certificate authority certificate to use for mTLS authorisation.
    type: string
  machine-reports.event-bus.kafka-version:
    default: ""
    description: |
      The kafka version you wish to specifically bind to, when not provided, 
      the kafka version is not validated.
    type: string
  kpi-reports.enabled:
    default: ""
    description: |
      Note: Currently not available for on-prem users!

      Key performance index: Metrics. Enables KPI worker - sends metrics to Influx.
    type: string
  kpi-reports.interval:
    default: "5m"
    description: |
      Note: Currently not available for on-prem users!

      Specifies KPI worker frequency.
    type: string

  influx.enabled:
    description: "Enables influx db support for time series reporting."
    type: boolean
  influx.url:
    # TODO: This should be changed to a relation
    description: "URL to connect to influx DB"
    type: string
  influx.token:
    description: |
      Token to use for influx.

      Deprecated: this option is stored in plain text in Juju's config; prefer setting
      influx.token-secret to a Juju secret URI instead.
    type: string
  influx.token-secret:
    description: |
      Preferred, Juju-secret-backed alternative to influx.token: takes priority over it
      when both are set. Must be set to the URI of a Juju secret containing a `value`
      key with the token.
    type: secret
  influx.bucket:
    description: "Bucket to send data"
    type: string
  influx.organization:
    description: "Organization name"
    type: string

  profiler.enabled:
    description: >
      Whether to enable or disable continuous profiling on the server or not.
    type: boolean
    default: false
  profiler.server-address:
    description: The pyroscope server address to send the metrics to.
    type: string
  profiler.hostname:
    description: the hostname of the server the profiler is running on. This is used as a tag to group metrics by the server it is running on.
    type: string
  profiler.sample-rate:
    description: sample rate for the profiler in Hz. 100 means reading 100 times per second.
    type: int
    default: 100
  profiler.upload-rate:
    description: The frequency of upload to the profiling server
    type: int
  profiler.mutex-profile-fraction:
    description: >
      this turns on mutex profiles with rate indicating the fraction of mutex contention events reported
      in the mutex profile. On average, 1/rate events are reported. Setting an aggressive rate can hurt performance. ProfileMutexes must be True
    type: int
    default: 5
  profiler.block-profile-rate:
    description: >
      this is the sampling average of one blocking event per `BlockProfileRate` nanoseconds spent blocked.
      For example, set rate to 1000000000 (aka int(time.Second.Nanoseconds())) to record one sample per second a goroutine is blocked.
      It is recommended to set this to values greater than 10,000. 
      For more info, visit this: https://github.com/DataDog/go-profiler-notes/blob/main/block.md#benchmarks
    type: int
    default: 50000
  profiler.profile-allocations:
    description: this will profile the memory for allocated space as well as allocated objects
    type: boolean
    default: false
  profiler.profile-inuse:
    description: this will profile the overall used memory as well as the memory used by objects
    type: boolean
    default: false
  profiler.profile-mutexes:
    description: this turns on profiling for mutexes
    default: false
    type: boolean
  profiler.profile-blocks:
    description: would profile blocking events (channels, select, etc) with the BlockProfileRate frequency.
    type: boolean
    default: false
  profiler.profile-goroutines:
    description: would profile separate concurrent running gorountines.
    default: false
    type: boolean
